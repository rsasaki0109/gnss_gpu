<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLATEAU NLOS Visualization</title>
<style>
body {
  margin: 0;
  background: #eef2f6;
  color: #17202a;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px;
}
h1 {
  margin: 0 0 6px;
  font-size: 28px;
  letter-spacing: 0;
}
p {
  margin: 0 0 18px;
  color: #52606d;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin: 18px 0;
}
.card {
  background: #ffffff;
  border: 1px solid #d8e0ea;
  border-radius: 8px;
  padding: 12px 14px;
}
.label {
  color: #607080;
  font-size: 13px;
}
.value {
  font-size: 22px;
  font-weight: 700;
  margin-top: 4px;
}
.grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
  gap: 14px;
  align-items: stretch;
}
.panel {
  background: #ffffff;
  border: 1px solid #d8e0ea;
  border-radius: 8px;
  padding: 10px;
}
.panel svg {
  width: 100%;
  height: auto;
  display: block;
}
.wide {
  margin-top: 14px;
}
.svg-title {
  font-size: 18px;
  font-weight: 700;
  fill: #17202a;
}
.svg-note, .legend text {
  font-size: 12px;
  fill: #52606d;
}
.sat-label {
  font-size: 12px;
  font-weight: 700;
  fill: #17202a;
}
@media (max-width: 820px) {
  main { padding: 16px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
