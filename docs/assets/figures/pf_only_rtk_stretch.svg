<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">PF-only RTK stretch campaign</title>
  <desc id="desc">Full-epoch three-dimensional under-50-centimeter accuracy for Tokyo run1 and Nagoya run1, comparing the current PF-only trajectory, an external latest libgnss++ selected reference, and the campaign target. The right panel shows the truth-free promotion pipeline and integrity requirements.</desc>
  <rect width="960" height="560" rx="16" fill="#0d1117"/>
  <text x="46" y="47" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="25" font-weight="700">PF-only promotion · Tokyo 45% floor cleared</text>
  <text x="46" y="75" fill="#8b949e" font-family="system-ui,sans-serif" font-size="14">Matched 3D · full epoch denominator · truth-free runtime · no runtime FGO</text>

  <g font-family="system-ui,sans-serif">
    <text x="46" y="113" fill="#f0f6fc" font-size="17" font-weight="600">&lt;50 cm full-epoch accuracy (%) ↑</text>
    <line x1="62" y1="430" x2="570" y2="430" stroke="#30363d"/>
    <line x1="62" y1="370" x2="570" y2="370" stroke="#21262d"/>
    <line x1="62" y1="310" x2="570" y2="310" stroke="#21262d"/>
    <line x1="62" y1="250" x2="570" y2="250" stroke="#21262d"/>
    <line x1="62" y1="190" x2="570" y2="190" stroke="#21262d"/>
    <line x1="62" y1="130" x2="570" y2="130" stroke="#21262d"/>
    <g fill="#8b949e" font-size="12" text-anchor="end">
      <text x="54" y="434">0</text><text x="54" y="374">20</text><text x="54" y="314">40</text>
      <text x="54" y="254">60</text><text x="54" y="194">80</text><text x="54" y="134">100</text>
    </g>

    <!-- Tokyo run1: scale 3 px per percentage point from y=430. -->
    <rect x="112" y="290" width="42" height="140" rx="5" fill="#3fb950"/>
    <rect x="160" y="190" width="42" height="240" rx="5" fill="#58a6ff"/>
    <rect x="208" y="295" width="42" height="135" rx="5" fill="#d29922"/>
    <g fill="#f0f6fc" font-size="12" text-anchor="middle">
      <text x="133" y="282">46.51</text><text x="181" y="182">80.02</text><text x="229" y="287">45.00</text>
    </g>

    <!-- Nagoya run1. -->
    <rect x="350" y="204" width="42" height="226" rx="5" fill="#3fb950"/>
    <rect x="398" y="172" width="42" height="258" rx="5" fill="#58a6ff"/>
    <rect x="446" y="221" width="42" height="209" rx="5" fill="#d29922"/>
    <g fill="#f0f6fc" font-size="12" text-anchor="middle">
      <text x="371" y="196">75.37</text><text x="419" y="164">85.84</text><text x="467" y="213">69.55</text>
    </g>
    <g fill="#c9d1d9" font-size="14" text-anchor="middle">
      <text x="181" y="457">Tokyo run1</text><text x="419" y="457">Nagoya run1</text>
    </g>
    <g font-size="12">
      <rect x="76" y="490" width="14" height="14" rx="2" fill="#3fb950"/><text x="98" y="502" fill="#c9d1d9">PF-only locked current</text>
      <rect x="245" y="490" width="14" height="14" rx="2" fill="#58a6ff"/><text x="267" y="502" fill="#c9d1d9">latest libgnss++ selected (external)</text>
      <rect x="483" y="490" width="14" height="14" rx="2" fill="#d29922"/><text x="505" y="502" fill="#c9d1d9">v0.3 promotion floor</text>
    </g>
    <text x="76" y="529" fill="#8b949e" font-size="11">External selected results are a reference, not a PF-only production result.</text>

    <line x1="600" y1="102" x2="600" y2="526" stroke="#30363d"/>
    <text x="630" y="116" fill="#f0f6fc" font-size="17" font-weight="600">Truth-free promotion path</text>

    <rect x="630" y="140" width="282" height="72" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="165" fill="#58a6ff" font-size="13" font-weight="700">1 · Candidate supply</text>
    <text x="647" y="187" fill="#c9d1d9" font-size="12">partial AR · DDPR FDE · cycle-slip arcs</text>
    <text x="647" y="204" fill="#8b949e" font-size="11">GNSS++ ideas; RTK observations only</text>
    <path d="M771 212 L771 230" stroke="#8b949e" stroke-width="2"/><path d="M766 225 L771 231 L776 225" fill="none" stroke="#8b949e" stroke-width="2"/>

    <rect x="630" y="232" width="282" height="72" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="257" fill="#3fb950" font-size="13" font-weight="700">2 · PF posterior</text>
    <text x="647" y="279" fill="#c9d1d9" font-size="12">temporal rank · road/height · outage bridge</text>
    <text x="647" y="296" fill="#8b949e" font-size="11">no runtime FGO; no reference truth</text>
    <path d="M771 304 L771 322" stroke="#8b949e" stroke-width="2"/><path d="M766 317 L771 323 L776 317" fill="none" stroke="#8b949e" stroke-width="2"/>

    <rect x="630" y="324" width="282" height="82" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="349" fill="#d29922" font-size="13" font-weight="700">3 · Promotion gates</text>
    <text x="647" y="371" fill="#c9d1d9" font-size="12">candidate margin · stability · residuals</text>
    <text x="647" y="390" fill="#c9d1d9" font-size="12">declared false FIX ≤ 1%</text>

    <rect x="630" y="432" width="282" height="78" rx="9" fill="#0f2d1d" stroke="#238636"/>
    <text x="647" y="457" fill="#3fb950" font-size="13" font-weight="700">Locked current integrity</text>
    <text x="647" y="480" fill="#c9d1d9" font-size="12">Nagoya: 5,715 / 7,583 · gain 441 / loss 0</text>
    <text x="647" y="499" fill="#c9d1d9" font-size="12">Tokyo: 5,546 / 11,924 · false FIX 0</text>
  </g>
</svg>
